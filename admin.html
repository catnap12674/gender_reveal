<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>管理画面 | ジェンダーリビール</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card">
    <div class="emoji-row">🔐👶</div>
    <h1 class="title">管理画面</h1>
    <p class="subtitle">性別データを登録・変更します。<br />このページはパスワードで保護されています。</p>

    <!-- ログインフォーム -->
    <form id="loginForm">
      <label class="field-label" for="password">パスワード</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button type="submit" class="btn btn-primary" id="loginBtn">ログイン</button>
      <p class="status-msg" id="loginStatus"></p>
    </form>

    <!-- ログイン後の性別選択フォーム -->
    <form id="genderForm" class="hidden">
      <div class="current-value" id="currentValue">現在の設定：未登録</div>

      <label class="field-label">性別を選択</label>
      <div class="gender-options">
        <div class="gender-option boy">
          <input type="radio" name="gender" id="genderBoy" value="boy" />
          <label for="genderBoy"><span class="icon">👦</span>男の子</label>
        </div>
        <div class="gender-option girl">
          <input type="radio" name="gender" id="genderGirl" value="girl" />
          <label for="genderGirl"><span class="icon">👧</span>女の子</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="saveBtn">保存する</button>
      <p class="status-msg" id="saveStatus"></p>
    </form>

    <div class="link-row">
      <a href="/reveal">👀 公開ページを見る</a>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
