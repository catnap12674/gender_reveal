<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>ジェンダーリビール 🎉</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="reveal-wrap">
    <div class="reveal-header">
      <h1>Gender Reveal 🎊</h1>
      <p>画面を指でこすって、赤ちゃんの性別をチェックしよう！</p>
    </div>

    <div class="stage" id="stage">
      <div class="stage-bg pending" id="stageBg">
        <div id="babyIllustration"></div>
        <div class="result-text hidden" id="resultText"></div>
      </div>
      <canvas id="scratchCanvas"></canvas>
      <div class="sparkle-layer" id="sparkleLayer"></div>
    </div>

    <div class="progress-pill" id="progressPill">こすって削ってね 0%</div>

    <div class="reveal-footer">Scratch &amp; Reveal 👶✨</div>
  </div>

  <script src="/js/svg-babies.js"></script>
  <script src="/js/reveal.js"></script>
</body>
</html>
